services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Points to the weights path INSIDE the container.
      # Dockerfile copies backend/models/best.pt → /app/backend/models/best.pt
      YOLO_WEIGHTS: /app/backend/models/best.onnx
      DATABASE_URL: "sqlite:////app/data/build_eye.db"
      STATIC_DIR: /app/backend/static
    volumes:
      - ./backend/static:/app/backend/static
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data: